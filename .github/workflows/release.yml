name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: |
          v=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("src/prime_lc_lcd/__init__.py").read())[1])')
          test "v$v" = "$GITHUB_REF_NAME"
      - run: pip install build pytest && python -m pytest -q
      - name: Build the .deb on the oldest supported Ubuntu (installs on newer ones too)
        run: scripts/check-deb.sh ubuntu:24.04 dist
      - run: python -m build
      - run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "$notes"
